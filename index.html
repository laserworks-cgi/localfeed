<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Lokal Media Feed</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
    }

    button {
      font: inherit;
    }

    .app-shell {
      width: min(100%, 560px);
      height: 100dvh;
      min-height: 0;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      isolation: isolate;
    }

    #bg-blur-canvas {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      opacity: 0;
      object-fit: cover;
      filter: blur(30px) brightness(.48);
      transform: scale(1.08);
      transform-origin: center;
      pointer-events: none;
      z-index: 0;
      transition: opacity .18s ease;
    }

    .app-shell.theme-blurred #bg-blur-canvas {
      opacity: 1;
    }

    .views-container {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .view-page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      overscroll-behavior: contain;
    }

    .view-page::-webkit-scrollbar {
      display: none;
    }

    .view-page.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #view-home {
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-padding-top: 0;
      scroll-padding-bottom: 60px;
      touch-action: pan-y;
      overscroll-behavior-y: contain;
      padding-bottom: 60px;
    }

    .feed-item {
      width: 100%;
      height: 100%;
      min-height: 100%;
      max-height: 100%;
      flex: 0 0 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: pan-y;
      contain: layout paint style;
    }

    .media-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      touch-action: pan-y;
    }

    .media-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: transparent;
    }

    .media-content {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      background: transparent;
    }

    .feed-item.rotated .media-content {
      width: 100dvh;
      height: 100dvw;
      max-width: none;
      max-height: none;
      flex: 0 0 auto;
      object-fit: contain;
      transform: rotate(90deg);
      will-change: transform;
    }

    .audio-box {
      width: min(78vw, 320px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .audio-cover {
      width: min(68vw, 220px);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      background: #181818;
      display: none;
    }

    .audio-default-icon {
      width: 64px;
      height: 64px;
      fill: #fff;
      opacity: .8;
    }

    .audio-title {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 700;
    }

    .audio-artist {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: rgba(255,255,255,.72);
    }

    .overlay-info {
      position: absolute;
      left: 16px;
      right: 70px;
      bottom: calc(76px + env(safe-area-inset-bottom));
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
      transition: opacity .15s ease;
    }

    .meta-user {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .meta-desc {
      font-size: 13px;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .meta-tags {
      font-size: 11px;
      opacity: .85;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sidebar {
      position: absolute;
      right: 12px;
      bottom: calc(90px + env(safe-area-inset-bottom));
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      transition: opacity .15s ease;
    }

    .side-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: none;
      border: none;
      color: #fff;
      font-size: 11px;
    }

    .side-btn svg {
      width: 28px;
      height: 28px;
      fill: #fff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.8));
      transition: transform .1s;
    }

    .side-btn.liked svg {
      fill: #fe2c55;
    }

    .pause-triangle-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(.8);
      background: none;
      border: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 45;
    }

    .pause-triangle-badge svg {
      width: 58px;
      height: 58px;
      fill: #fff;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.75));
    }

    .pause-triangle-badge.animate-triangle {
      animation: triangleFade .32s cubic-bezier(.25,.8,.25,1) forwards;
    }

    @keyframes triangleFade {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.7); }
      35% { opacity: .95; transform: translate(-50%,-50%) scale(1.1); }
      65% { opacity: .85; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.15); }
    }

    .heart-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 90px;
      fill: #fe2c55;
      pointer-events: none;
      transform: translate(-50%,-50%) scale(0);
      animation: heartPopFast .42s cubic-bezier(.17,.89,.32,1.28) forwards;
      z-index: 50;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.6));
    }

    @keyframes heartPopFast {
      0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
      45% { transform: translate(-50%,-50%) scale(1.22); opacity: 1; }
      100% { transform: translate(-50%,-65%) scale(1.05); opacity: 0; }
    }

    .rotate-pill {
      position: absolute;
      left: 50%;
      bottom: 24%;
      transform: translate(-50%, 8px);
      z-index: 40;
      background: rgba(20,20,20,.82);
      border: .5px solid rgba(255,255,255,.35);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.65);
      touch-action: manipulation;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .rotate-pill.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .rotate-pill svg {
      width: 15px;
      height: 15px;
      fill: #fff;
    }

    .rotate-pill span {
      font-size: 11px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      letter-spacing: .2px;
    }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      transition: opacity .15s ease;
    }

    .bottom-btn {
      width: 33.333%;
      height: 100%;
      background: none;
      border: none;
      color: rgba(255,255,255,.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    .bottom-btn.active {
      color: #fff;
    }

    .bottom-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .empty-view {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #777;
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }

    .grid-view {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px;
      padding: 3px 3px calc(70px + env(safe-area-inset-bottom));
    }

    .grid-item {
      aspect-ratio: 9/16;
      min-width: 0;
      background: #181818;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      contain: paint layout style;
    }

    .grid-item.loading::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg,#181818 25%,#222 37%,#181818 63%);
      background-size: 220% 100%;
      animation: thumbShimmer 1.1s linear infinite;
    }

    @keyframes thumbShimmer {
      to { background-position-x: -220%; }
    }

    .grid-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .16s ease;
    }

    .grid-thumb.ready {
      opacity: 1;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.02) 40%, rgba(0,0,0,.84) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 6px;
      pointer-events: none;
    }

    .grid-item-title {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 2px;
      text-shadow: 0 1px 3px rgba(0,0,0,.9);
    }

    .grid-item-date {
      font-size: 9px;
      color: rgba(255,255,255,.75);
      text-shadow: 0 1px 2px rgba(0,0,0,.9);
    }

    .profile-card {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100%;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 0;
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      flex: 0 0 auto;
    }

    .profile-summary {
      min-width: 0;
    }

    .profile-summary-name {
      font-weight: 700;
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-summary-count {
      margin-top: 4px;
      font-size: 12px;
      color: #888;
    }

    .profile-btn-upload {
      width: 100%;
      min-height: 46px;
      background: #fe2c55;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(254,44,85,.25);
    }

    .profile-section {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 15px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 11px;
      color: rgba(255,255,255,.8);
    }

    .theme-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .theme-btn {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.2);
      background: transparent;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .theme-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    #upload-loading {
      position: absolute;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .progress-box {
      width: 200px;
      height: 6px;
      background: rgba(255,255,255,.2);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #fe2c55;
      transition: width .08s linear;
    }

    .app-shell.feed-rotated .top-header-glass,
    .app-shell.feed-rotated .bottom-nav,
    .app-shell.feed-rotated .overlay-info,
    .app-shell.feed-rotated .sidebar {
      opacity: 0;
      pointer-events: none;
    }

    @media (min-width: 700px) {
      body {
        background: #101010;
      }

      .app-shell {
        box-shadow: 0 0 60px rgba(0,0,0,.4);
      }
    }

    @media (max-width: 360px) {
      .grid-view {
        grid-template-columns: repeat(3, minmax(0,1fr));
      }

      .profile-card {
        padding-left: 12px;
        padding-right: 12px;
      }

      .profile-header {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <canvas id="bg-blur-canvas" aria-hidden="true"></canvas>

    <input type="file" id="fileInput" accept="video/*,audio/*,image/*" multiple hidden>

    <div class="views-container">
      <div class="view-page active" id="view-home">
        <div class="empty-view" id="empty-home">
          Belum ada media diunggah.<br>
          Buka Profile untuk menambah file.
        </div>
      </div>

      <div class="view-page" id="view-explore">
        <div class="grid-view" id="explore-grid"></div>
        <div class="empty-view" id="empty-explore">Belum ada thumbnail media.</div>
      </div>

      <div class="view-page" id="view-profile">
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar">M</div>
            <div class="profile-summary">
              <div class="profile-summary-name">@lokal.user</div>
              <div class="profile-summary-count" id="media-count-txt">0 Media dimuat</div>
            </div>
          </div>

          <button class="profile-btn-upload" id="btnUpload" type="button">
            <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
            Tambah Media Lokal
          </button>

          <div class="profile-section">
            <div class="section-title">Tampilan</div>
            <div class="theme-options">
              <button class="theme-btn active" data-theme="default" type="button">Default</button>
              <button class="theme-btn" data-theme="blurred" type="button">Blurred Konten</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-nav" id="bottomNav">
      <button class="bottom-btn active" data-nav="home" type="button">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"/></svg>
        <span>Home</span>
      </button>
      <button class="bottom-btn" data-nav="explore" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <span>Explore</span>
      </button>
      <button class="bottom-btn" data-nav="profile" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Profile</span>
      </button>
    </div>

    <div id="upload-loading">
      <div style="font-size:13px;font-weight:600">Menyiapkan Media...</div>
      <div class="progress-box"><div class="progress-bar" id="pbar"></div></div>
    </div>
  </div>

  <script>
    const mediaList = [];
    const feedMap = new Map();
    const exploreMap = new Map();
    const uploadedSignatures = new Set();

    let nextId = 1;
    let isHomeActive = true;
    let currentActiveFeedItem = null;
    let ambientRaf = 0;
    let ambientLastDraw = 0;
    let activeAmbientSource = null;

    const appShell = document.getElementById('appShell');
    const homeView = document.getElementById('view-home');
    const exploreView = document.getElementById('view-explore');
    const exploreGrid = document.getElementById('explore-grid');
    const emptyHome = document.getElementById('empty-home');
    const emptyExplore = document.getElementById('empty-explore');
    const fileInput = document.getElementById('fileInput');
    const uploadLoading = document.getElementById('upload-loading');
    const pbar = document.getElementById('pbar');
    const mediaCountTxt = document.getElementById('media-count-txt');
    const bgCanvas = document.getElementById('bg-blur-canvas');
    const bgCtx = bgCanvas.getContext('2d', { alpha: true });

    function updateCounts() {
      const label = `${mediaList.length} Media dimuat`;
      mediaCountTxt.textContent = label;
      emptyHome.style.display = mediaList.length ? 'none' : 'flex';
      emptyExplore.style.display = mediaList.length ? 'none' : 'flex';
    }

    function switchBottomNav(name) {
      document.querySelectorAll('.bottom-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.nav === name);
      });
      document.querySelectorAll('.view-page').forEach(page => page.classList.remove('active'));

      const target = document.getElementById(`view-${name}`);
      if (target) target.classList.add('active');

      if (name !== 'home') {
        isHomeActive = false;
        clearFeedRotation();
        stopAllMedia();
        stopAmbient();
      } else {
        isHomeActive = true;
        const item = getCurrentlyVisibleFeedItem();
        if (item) activateFeedItem(item, true);
      }
    }

    document.querySelectorAll('.bottom-btn').forEach(btn => {
      btn.addEventListener('click', () => switchBottomNav(btn.dataset.nav));
    });

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const blurred = btn.dataset.theme === 'blurred';
        document.querySelectorAll('.theme-btn').forEach(b => {
          b.classList.toggle('active', b === btn);
        });
        appShell.classList.toggle('theme-blurred', blurred);
        if (!blurred) clearAmbientCanvas();
      });
    });

    document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function getCurrentlyVisibleFeedItem() {
      if (currentActiveFeedItem && currentActiveFeedItem.isConnected && currentActiveFeedItem.style.display !== 'none') {
        return currentActiveFeedItem;
      }

      const items = [...feedMap.values()];
      const viewRect = homeView.getBoundingClientRect();

      let best = null;
      let bestRatio = 0;

      for (const item of items) {
        if (item.style.display === 'none') continue;
        const r = item.getBoundingClientRect();
        const visible = Math.max(0, Math.min(r.bottom, viewRect.bottom) - Math.max(r.top, viewRect.top));
        const ratio = visible / Math.max(1, r.height);
        if (ratio > bestRatio) {
          bestRatio = ratio;
          best = item;
        }
      }

      return best || items[0] || null;
    }

    function stopAllMedia(except = null) {
      document.querySelectorAll('#view-home video, #view-home audio').forEach(media => {
        if (media !== except) media.pause();
      });
    }

    async function playOnly(media, item) {
      if (!media || !item || !isHomeActive || item !== currentActiveFeedItem) return;

      stopAllMedia(media);

      try {
        await media.play();
      } catch (_) {
        if (media instanceof HTMLVideoElement || media instanceof HTMLAudioElement) {
          media.muted = true;
          try { await media.play(); } catch (_) {}
        }
      }
    }

    function removeFeedMedia(item) {
      const host = item.querySelector('.media-host');
      const media = host?.querySelector('video, audio, img');
      if (!media) return;

      if (media.tagName === 'VIDEO' || media.tagName === 'AUDIO') {
        media.pause();
        media.removeAttribute('src');
        media.load();
      } else {
        media.removeAttribute('src');
      }

      media.remove();
      host.appendChild(makeMediaPlaceholder());
    }

    function makeMediaPlaceholder() {
      const node = document.createElement('div');
      node.className = 'media-placeholder';
      return node;
    }

    function ensureFeedMedia(item, data) {
      const host = item.querySelector('.media-host');
      if (!host) return null;

      let media = host.querySelector('video, audio, img');
      if (media) return media;

      host.textContent = '';

      if (data.type.startsWith('video/')) {
        media = document.createElement('video');
        media.className = 'media-content';
        media.src = data.url;
        media.loop = true;
        media.playsInline = true;
        media.preload = 'metadata';
        media.muted = true;
        media.controls = false;

        media.addEventListener('loadedmetadata', () => {
          item.querySelector('.res').textContent = `${media.videoWidth}x${media.videoHeight}`;
          const landscape = media.videoWidth > media.videoHeight;
          item.dataset.isLandscape = landscape ? 'true' : 'false';
          const pill = item.querySelector('.rotate-pill');
          pill.hidden = !landscape;
          if (landscape) showRotatePill(item);
        }, { once: false });

        media.addEventListener('timeupdate', () => {
          if (item === currentActiveFeedItem && appShell.classList.contains('theme-blurred')) {
            scheduleAmbient(item);
          }
        });

        host.appendChild(media);
      } else if (data.type.startsWith('image/')) {
        media = document.createElement('img');
        media.className = 'media-content';
        media.alt = '';
        media.src = data.url;
        media.decoding = 'async';
        media.addEventListener('load', () => {
          item.querySelector('.res').textContent = `${media.naturalWidth}x${media.naturalHeight}`;
          scheduleAmbient(item);
        }, { once: true });
        host.appendChild(media);
      } else {
        const box = document.createElement('div');
        box.className = 'audio-box';

        const cover = document.createElement('img');
        cover.className = 'audio-cover';
        cover.alt = '';

        const defaultIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        defaultIcon.setAttribute('class', 'audio-default-icon');
        defaultIcon.setAttribute('viewBox', '0 0 24 24');
        defaultIcon.innerHTML = '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>';

        const title = document.createElement('div');
        title.className = 'audio-title';
        title.textContent = data.title || 'Audio Lokal';

        const artist = document.createElement('div');
        artist.className = 'audio-artist';
        artist.textContent = data.artist || '';

        box.append(cover, defaultIcon, title, artist);
        host.appendChild(box);

        media = document.createElement('audio');
        media.src = data.url;
        media.loop = true;
        media.preload = 'metadata';
        media.muted = true;
        media.style.display = 'none';

        media.addEventListener('loadedmetadata', () => {
          item.querySelector('.res').textContent = `Audio (${formatTime(media.duration)})`;
        }, { once: true });

        host.appendChild(media);

        readAudioMetadata(data.file).then(meta => {
          if (!meta || !item.isConnected) return;
          data.metadata = meta;
          data.artist = meta.artist || '';
          data.album = meta.album || '';
          data.title = meta.title || '';

          title.textContent = data.title || 'Audio Lokal';
          artist.textContent = data.artist || '';

          const desc = item.querySelector('.meta-desc');
          if (desc) desc.textContent = [data.title, data.artist].filter(Boolean).join(' — ') || data.name;

          const parts = [data.artist, data.album].filter(Boolean);
          if (parts.length) item.querySelector('.res').textContent = parts.join(' • ');

          if (meta.coverUrl) {
            cover.src = meta.coverUrl;
            cover.style.display = 'block';
            defaultIcon.style.display = 'none';
            scheduleAmbient(item);
            prepareAudioThumb(data, meta.coverUrl);
          }
        }).catch(() => {});
      }

      return media;
    }

    function activateFeedItem(item, autoPlay = false) {
      if (!item || !item.isConnected) return;

      currentActiveFeedItem = item;
      const data = mediaList.find(m => m.id === Number(item.dataset.id));
      if (!data) return;

      const media = ensureFeedMedia(item, data);
      if (!media) return;

      if (autoPlay && media.tagName !== 'IMG' && !item.dataset.userPaused) {
        playOnly(media, item);
      }

      scheduleAmbient(item);
    }

    function deactivateFeedItem(item) {
      const media = item.querySelector('video, audio');
      if (media) media.pause();
      item.dataset.userPaused = '';
      item.classList.remove('rotated');

      if (item === currentActiveFeedItem) {
        stopAmbient();
      }

      // Keep the active item warm; release media nodes for distant items only.
      const rect = item.getBoundingClientRect();
      const viewRect = homeView.getBoundingClientRect();
      const far = rect.bottom < viewRect.top - viewRect.height * 1.4 || rect.top > viewRect.bottom + viewRect.height * 1.4;
      if (far) removeFeedMedia(item);
    }

    const feedObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const item = entry.target;
        if (entry.isIntersecting && entry.intersectionRatio >= .65) {
          if (!isHomeActive) return;
          activateFeedItem(item, true);
          showRotatePill(item);
        } else if (entry.intersectionRatio < .2) {
          if (item !== currentActiveFeedItem || !isHomeActive) deactivateFeedItem(item);
        }
      });
    }, {
      root: homeView,
      threshold: [0, .2, .65, 1]
    });

    function createFeedElement(data) {
      const item = document.createElement('div');
      item.className = 'feed-item';
      item.dataset.id = String(data.id);

      const wrapper = document.createElement('div');
      wrapper.className = 'media-wrapper';

      const host = document.createElement('div');
      host.className = 'media-host';
      host.appendChild(makeMediaPlaceholder());

      const pauseBadge = document.createElement('div');
      pauseBadge.className = 'pause-triangle-badge';
      pauseBadge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

      const rotatePill = document.createElement('button');
      rotatePill.className = 'rotate-pill';
      rotatePill.type = 'button';
      rotatePill.hidden = true;
      rotatePill.title = 'Putar media di dalam feed';
      rotatePill.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-10.96 4l-1.33 1.32C2.25 9.4 0 12.57 0 16.33h1.5c.36-3.76 2.7-6.93 5.97-8.48L6.15 6.52h1.37zm1.96 14.96c-3.27-1.55-5.61-4.72-5.97-8.48H0c.51 6.16 5.66 11 11.95 11l.66-.03-3.81-3.81-1.32 1.32zm10.96-4l1.33-1.32c1.94-1.56 4.19-4.73 4.19-8.49h-1.5c-.36 3.76-2.7 6.93-5.97 8.48l1.32 1.33h-1.37zM7 19h10V5H7v14zm2-12h6v10H9V7z"/></svg>';
      const rotateText = document.createElement('span');
      rotateText.textContent = 'Rotate';
      rotatePill.appendChild(rotateText);

      wrapper.append(host, pauseBadge, rotatePill);

      const info = document.createElement('div');
      info.className = 'overlay-info';

      const user = document.createElement('div');
      user.className = 'meta-user';
      user.textContent = `@lokal.${data.type.split('/')[0] || 'file'}`;

      const desc = document.createElement('div');
      desc.className = 'meta-desc';
      desc.textContent = data.name;

      const tags = document.createElement('div');
      tags.className = 'meta-tags';

      const resWrap = document.createElement('span');

      res.textContent = '...';

      tags.append(resWrap, bullet, date);
      info.append(user, desc, tags);

      const sidebar = document.createElement('div');
      sidebar.className = 'sidebar';

      const likeBtn = document.createElement('button');
      likeBtn.className = 'side-btn btn-like';
      likeBtn.type = 'button';
      likeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>Suka</span>';

      sidebar.appendChild(likeBtn);
      item.append(wrapper, info, sidebar);

      const showRotatePill = () => {
        if (item.dataset.isLandscape !== 'true' || !isHomeActive) return;
        rotatePill.classList.add('visible');
        window.clearTimeout(item._rotateTimer);
        item._rotateTimer = window.setTimeout(() => {
          rotatePill.classList.remove('visible');
        }, 4000);
      };

      const hideRotatePill = () => {
        window.clearTimeout(item._rotateTimer);
        rotatePill.classList.remove('visible');
      };

      item._showRotatePill = showRotatePill;
      item._hideRotatePill = hideRotatePill;

      rotatePill.addEventListener('pointerup', event => {
        event.preventDefault();
        event.stopPropagation();

        const media = item.querySelector('video');
        if (!media) return;

        if (item.classList.contains('rotated')) {
          item.classList.remove('rotated');
          appShell.classList.remove('feed-rotated');
          rotateText.textContent = 'Rotate';
          showRotatePill();
        } else {
          clearFeedRotation();
          item.classList.add('rotated');
          appShell.classList.add('feed-rotated');
          rotateText.textContent = 'Kembali';
          rotatePill.classList.add('visible');
          hideRotatePill();
          rotatePill.classList.add('visible');
        }
      });

      likeBtn.addEventListener('pointerup', event => {
        event.preventDefault();
        event.stopPropagation();
        data.liked = !data.liked;
        likeBtn.classList.toggle('liked', data.liked);
      });

      let pointerDownX = 0;
      let pointerDownY = 0;
      let pointerMoved = false;
      let tapCount = 0;
      let tapTimer = 0;

      wrapper.addEventListener('pointerdown', event => {
        if (event.button !== undefined && event.button !== 0) return;
        pointerDownX = event.clientX;
        pointerDownY = event.clientY;
        pointerMoved = false;
      });

      wrapper.addEventListener('pointermove', event => {
        if (Math.abs(event.clientX - pointerDownX) > 10 || Math.abs(event.clientY - pointerDownY) > 10) {
          pointerMoved = true;
        }
      });

      wrapper.addEventListener('pointerup', event => {
        if (pointerMoved || event.target === rotatePill || rotatePill.contains(event.target)) return;

        tapCount++;
        if (tapCount === 1) {
          window.clearTimeout(tapTimer);
          tapTimer = window.setTimeout(() => {
            tapCount = 0;
            const media = item.querySelector('video, audio');
            if (!media) return;

            if (media.paused) {
              item.dataset.userPaused = '';
              playOnly(media, item);
            } else {
              media.pause();
              item.dataset.userPaused = 'true';
              triggerPauseTriangle();
            }
          }, 250);
        } else {
          window.clearTimeout(tapTimer);
          tapCount = 0;
          data.liked = true;
          likeBtn.classList.add('liked');
          popHeartCenter();
        }
      });

      function triggerPauseTriangle() {
        pauseBadge.classList.remove('animate-triangle');
        void pauseBadge.offsetWidth;
        pauseBadge.classList.add('animate-triangle');
      }

      function popHeartCenter() {
        const heart = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        heart.setAttribute('viewBox', '0 0 24 24');
        heart.setAttribute('class', 'heart-center');
        heart.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
        wrapper.appendChild(heart);
        window.setTimeout(() => heart.remove(), 420);
      }

      homeView.appendChild(item);
      feedMap.set(data.id, item);
      feedObserver.observe(item);
      return item;
    }

    let exploreThumbQueue = [];
    let exploreThumbBusy = 0;
    const MAX_THUMB_WORKERS = 2;

    const exploreObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const card = entry.target;
        const id = Number(card.dataset.id);
        const data = mediaList.find(m => m.id === id);
        if (!data) return;
        queueExploreThumbnail(card, data);
        exploreObserver.unobserve(card);
      });
    }, {
      root: exploreView,
      rootMargin: '360px 0px',
      threshold: .01
    });

    function queueExploreThumbnail(card, data) {
      if (card.dataset.thumbQueued === 'true' || card.dataset.thumbReady === 'true') return;
      card.dataset.thumbQueued = 'true';
      exploreThumbQueue.push({ card, data });
      pumpThumbnailQueue();
    }

    function pumpThumbnailQueue() {
      while (exploreThumbBusy < MAX_THUMB_WORKERS && exploreThumbQueue.length) {
        const job = exploreThumbQueue.shift();
        exploreThumbBusy++;
        renderExploreThumbnail(job.card, job.data)
          .catch(() => {})
          .finally(() => {
            exploreThumbBusy--;
            pumpThumbnailQueue();
          });
      }
    }

    async function renderExploreThumbnail(card, data) {
      const holder = card.querySelector('.thumb-holder');
      if (!holder) return;

      const url = await getSmallThumbnail(data);

      if (!card.isConnected) return;

      holder.textContent = '';
      if (url) {
        const img = document.createElement('img');
        img.className = 'grid-thumb';
        img.alt = '';
        img.src = url;
        img.decoding = 'async';
        img.onload = () => img.classList.add('ready');
        holder.appendChild(img);
      }

      card.dataset.thumbReady = 'true';
      card.classList.remove('loading');
    }

    async function getSmallThumbnail(data) {
      if (data.thumbUrl) return data.thumbUrl;

      if (data.type.startsWith('image/')) {
        data.thumbUrl = await createImageThumbnail(data.file, 280);
        return data.thumbUrl;
      }

      if (data.type.startsWith('video/')) {
        data.thumbUrl = await createVideoThumbnail(data.file, 280, 360);
        return data.thumbUrl;
      }

      if (data.type.startsWith('audio/') && data.coverUrl) {
        data.thumbUrl = await createImageThumbnail(await (await fetch(data.coverUrl)).blob(), 280);
        return data.thumbUrl;
      }

      return '';
    }

    async function createImageThumbnail(fileOrBlob, maxSize = 280) {
      const src = URL.createObjectURL(fileOrBlob);
      try {
        const img = new Image();
        img.decoding = 'async';
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = src;
        });

        const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.drawImage(img, 0, 0, w, h);

        const blob = await canvasToBlob(canvas, 'image/jpeg', .78);
        return URL.createObjectURL(blob);
      } finally {
        URL.revokeObjectURL(src);
      }
    }

    async function createVideoThumbnail(file, maxW = 280, maxH = 360) {
      const src = URL.createObjectURL(file);
      const video = document.createElement('video');
      video.src = src;
      video.muted = true;
      video.playsInline = true;
      video.preload = 'metadata';

      try {
        await waitForEvent(video, 'loadedmetadata', 12000);
        const targetTime = Math.min(Math.max(video.duration * .25, .2), Math.max(.2, video.duration - .1));
        if (Number.isFinite(video.duration)) {
          video.currentTime = targetTime;
          await waitForEvent(video, 'seeked', 12000).catch(() => {});
        }

        const ratio = video.videoWidth / Math.max(1, video.videoHeight);
        let w = maxW;
        let h = Math.round(w / ratio);

        if (h > maxH) {
          h = maxH;
          w = Math.round(h * ratio);
        }

        w = Math.max(1, w);
        h = Math.max(1, h);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.drawImage(video, 0, 0, w, h);

        const blob = await canvasToBlob(canvas, 'image/jpeg', .76);
        return URL.createObjectURL(blob);
      } finally {
        video.pause();
        video.removeAttribute('src');
        video.load();
        URL.revokeObjectURL(src);
      }
    }

    function prepareAudioThumb(data, coverUrl) {
      if (data.thumbUrl) return;
      fetch(coverUrl)
        .then(r => r.blob())
        .then(blob => createImageThumbnail(blob, 280))
        .then(url => {
          data.thumbUrl = url;
          const card = exploreMap.get(data.id);
          if (card && card.dataset.thumbReady === 'true') {
            const old = card.querySelector('.grid-thumb');
            const img = document.createElement('img');
            img.className = 'grid-thumb';
            img.alt = '';
            img.src = url;
            img.onload = () => img.classList.add('ready');
            if (old) old.replaceWith(img);
            else card.querySelector('.thumb-holder').appendChild(img);
          }
        })
        .catch(() => {});
    }

    function waitForEvent(target, type, timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        let done = false;
        const cleanup = () => {
          target.removeEventListener(type, onEvent);
          target.removeEventListener('error', onError);
          if (timer) clearTimeout(timer);
        };
        const onEvent = () => {
          if (done) return;
          done = true;
          cleanup();
          resolve();
        };
        const onError = event => {
          if (done) return;
          done = true;
          cleanup();
          reject(event);
        };
        const timer = setTimeout(() => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error(`Timeout menunggu ${type}`));
        }, timeoutMs);

        target.addEventListener(type, onEvent, { once: true });
        target.addEventListener('error', onError, { once: true });
      });
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve, reject) => {
        if (canvas.toBlob) {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Canvas kosong')), type, quality);
        } else {
          try {
            const data = canvas.toDataURL(type, quality);
            const bytes = atob(data.split(',')[1]);
            const buf = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
            resolve(new Blob([buf], { type }));
          } catch (err) {
            reject(err);
          }
        }
      });
    }

    function createExploreElement(data) {
      const card = document.createElement('div');
      card.className = 'grid-item loading';
      card.dataset.id = String(data.id);

      const holder = document.createElement('div');
      holder.className = 'thumb-holder';
      holder.style.cssText = 'width:100%;height:100%;position:absolute;inset:0;display:block;';

      const overlay = document.createElement('div');
      overlay.className = 'grid-overlay';

      const title = document.createElement('div');
      title.className = 'grid-item-title';
      title.textContent = data.name;

      const date = document.createElement('div');
      date.className = 'grid-item-date';
      date.textContent = data.date;

      overlay.append(title, date);
      card.append(holder, overlay);

      card.addEventListener('click', () => {
        switchBottomNav('home');
        const target = feedMap.get(data.id);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      exploreGrid.appendChild(card);
      exploreMap.set(data.id, card);
      exploreObserver.observe(card);
      return card;
    }

    function clearFeedRotation() {
      appShell.classList.remove('feed-rotated');
      document.querySelectorAll('.feed-item.rotated').forEach(item => {
        item.classList.remove('rotated');
        const pill = item.querySelector('.rotate-pill span');
        if (pill) pill.textContent = 'Rotate';
      });
    }

    function showRotatePill(item) {
      if (!item?._showRotatePill) return;
      if (item.dataset.isLandscape === 'true') item._showRotatePill();
    }

    function drawCoverToCanvas(img, opacity = 1) {
      resizeAmbientCanvas();
      const w = bgCanvas.width;
      const h = bgCanvas.height;
      bgCtx.clearRect(0, 0, w, h);
      bgCtx.globalAlpha = opacity;
      drawCover(bgCtx, img, w, h);
      bgCtx.globalAlpha = 1;
    }

    function drawCover(ctx, source, width, height) {
      const sw = source.videoWidth || source.naturalWidth || source.width;
      const sh = source.videoHeight || source.naturalHeight || source.height;
      if (!sw || !sh) return;

      const scale = Math.max(width / sw, height / sh);
      const dw = sw * scale;
      const dh = sh * scale;
      const dx = (width - dw) / 2;
      const dy = (height - dh) / 2;
      ctx.drawImage(source, dx, dy, dw, dh);
    }

    function resizeAmbientCanvas() {
      const w = Math.max(160, Math.min(480, Math.round(appShell.clientWidth * .75)));
      const h = Math.max(240, Math.min(720, Math.round(appShell.clientHeight * .75)));
      if (bgCanvas.width !== w || bgCanvas.height !== h) {
        bgCanvas.width = w;
        bgCanvas.height = h;
      }
    }

    function clearAmbientCanvas() {
      cancelAnimationFrame(ambientRaf);
      ambientRaf = 0;
      activeAmbientSource = null;
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    }

    function stopAmbient() {
      clearAmbientCanvas();
    }

    function scheduleAmbient(item) {
      if (!appShell.classList.contains('theme-blurred') || !item || item !== currentActiveFeedItem) return;

      const data = mediaList.find(m => m.id === Number(item.dataset.id));
      if (!data) return;

      const source = item.querySelector('video, img, .audio-cover');
      if (!source) return;

      activeAmbientSource = source;
      resizeAmbientCanvas();

      if (source.tagName === 'VIDEO') {
        if (!ambientRaf) ambientLastDraw = 0;
        cancelAnimationFrame(ambientRaf);
        const loop = ts => {
          ambientRaf = requestAnimationFrame(loop);
          if (!activeAmbientSource || activeAmbientSource !== source || item !== currentActiveFeedItem || !appShell.classList.contains('theme-blurred')) {
            cancelAnimationFrame(ambientRaf);
            ambientRaf = 0;
            return;
          }
          if (ts - ambientLastDraw < 110) return;
          ambientLastDraw = ts;
          if (source.readyState >= 2) {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            drawCover(bgCtx, source, bgCanvas.width, bgCanvas.height);
          }
        };
        ambientRaf = requestAnimationFrame(loop);
      } else {
        cancelAnimationFrame(ambientRaf);
        ambientRaf = 0;
        if (source.complete && source.naturalWidth) {
          drawCoverToCanvas(source);
        } else {
          source.addEventListener('load', () => {
            if (item === currentActiveFeedItem && appShell.classList.contains('theme-blurred')) {
              drawCoverToCanvas(source);
            }
          }, { once: true });
        }
      }
    }

    homeView.addEventListener('scroll', () => {
      // IntersectionObserver owns activation; this only nudges a resize for smoother snaps.
      if (appShell.classList.contains('theme-blurred')) resizeAmbientCanvas();
    }, { passive: true });

    window.addEventListener('resize', () => resizeAmbientCanvas());

    fileInput.addEventListener('change', async event => {
      const rawFiles = Array.from(event.target.files || []);
      event.target.value = '';
      if (!rawFiles.length) return;

      const files = rawFiles.filter(file => {
        const sig = `${file.name}_${file.size}_${file.lastModified}`;
        if (uploadedSignatures.has(sig)) return false;
        uploadedSignatures.add(sig);
        return true;
      });

      if (!files.length) return;

      uploadLoading.style.display = 'flex';
      pbar.style.width = '0%';

      try {
        const total = files.length;
        for (let i = 0; i < files.length; i++) {
          await addMedia(files[i]);
          pbar.style.width = `${Math.round(((i + 1) / total) * 100)}%`;
        }
      } finally {
        setTimeout(() => {
          uploadLoading.style.display = 'none';
          pbar.style.width = '0%';
        }, 180);
      }

      updateCounts();
      switchBottomNav('home');

      requestAnimationFrame(() => {
        if (!currentActiveFeedItem) {
          const first = [...feedMap.values()][0];
          if (first) {
            currentActiveFeedItem = first;
            activateFeedItem(first, true);
          }
        }
      });
    });

    async function addMedia(file) {
      const id = nextId++;
      const data = {
        id,
        file,
        url: URL.createObjectURL(file),
        liked: false,
        type: file.type || '',
        name: file.name || 'Media Lokal',
        date: new Date(file.lastModified || Date.now()).toLocaleDateString('id-ID', {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        }),
        size: `${(file.size / (1024 * 1024)).toFixed(2)} MB`,
        metadata: null,
        coverUrl: '',
        thumbUrl: '',
        artist: '',
        album: '',
        title: ''
      };

      mediaList.push(data);
      createFeedElement(data);
      createExploreElement(data);
    }

    function cleanupMediaUrls() {
      for (const data of mediaList) {
        if (data.url) URL.revokeObjectURL(data.url);
        if (data.thumbUrl) URL.revokeObjectURL(data.thumbUrl);
        if (data.coverUrl) URL.revokeObjectURL(data.coverUrl);
      }
    }

    window.addEventListener('beforeunload', cleanupMediaUrls);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAllMedia();
        stopAmbient();
      } else if (isHomeActive) {
        const item = getCurrentlyVisibleFeedItem();
        if (item) activateFeedItem(item, true);
      }
    });

    // ------------------------------------------------------------
    // Metadata audio lokal: ID3v2 TIT2/TPE1/TALB/TDRC/APIC
    // ------------------------------------------------------------
    function decodeText(bytes, encoding) {
      try {
        if (encoding === 1) return new TextDecoder('utf-16').decode(bytes).replace(/\u0000+$/g, '').trim();
        if (encoding === 2) return new TextDecoder('utf-16be').decode(bytes).replace(/\u0000+$/g, '').trim();
        if (encoding === 3) return new TextDecoder('utf-8').decode(bytes).replace(/\u0000+$/g, '').trim();
        return new TextDecoder('iso-8859-1').decode(bytes).replace(/\u0000+$/g, '').trim();
      } catch (_) {
        return '';
      }
    }

    function readSyncSafe(b0, b1, b2, b3) {
      return ((b0 & 0x7f) << 21) | ((b1 & 0x7f) << 14) | ((b2 & 0x7f) << 7) | (b3 & 0x7f);
    }

    function parseTextFrame(payload) {
      if (!payload?.length) return '';
      return decodeText(payload.subarray(1), payload[0]);
    }

    function parseAPIC(payload) {
      if (!payload || payload.length < 5) return null;

      const encoding = payload[0];
      let p = 1;

      const mimeEnd = payload.indexOf(0, p);
      if (mimeEnd < 0) return null;

      const mimeRaw = new TextDecoder('iso-8859-1').decode(payload.subarray(p, mimeEnd)).trim();
      const mime = mimeRaw || 'image/jpeg';
      p = mimeEnd + 1;

      if (p >= payload.length) return null;
      p += 1;

      if (encoding === 1 || encoding === 2) {
        for (; p + 1 < payload.length; p += 2) {
          if (payload[p] === 0 && payload[p + 1] === 0) {
            p += 2;
            break;
          }
        }
      } else {
        const descEnd = payload.indexOf(0, p);
        p = descEnd >= 0 ? descEnd + 1 : p;
      }

      if (p >= payload.length) return null;
      return { mime, bytes: payload.subarray(p) };
    }

    async function readAudioMetadata(file) {
      if (!file || !/^audio\//i.test(file.type)) return null;

      const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
      if (head.length < 10 || head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return null;

      const version = head[3];
      const tagSize = readSyncSafe(head[6], head[7], head[8], head[9]);
      const tagBytes = new Uint8Array(await file.slice(10, 10 + tagSize).arrayBuffer());

      const meta = {
        title: '',
        artist: '',
        album: '',
        year: '',
        genre: '',
        coverUrl: ''
      };

      let p = 0;

      while (p + 10 <= tagBytes.length) {
        const id = String.fromCharCode(tagBytes[p], tagBytes[p + 1], tagBytes[p + 2], tagBytes[p + 3]);
        if (!id.trim() || id[0] === '\0') break;

        let frameSize = 0;
        if (version >= 4) {
          frameSize = readSyncSafe(tagBytes[p + 4], tagBytes[p + 5], tagBytes[p + 6], tagBytes[p + 7]);
        } else {
          frameSize =
            (tagBytes[p + 4] << 24) |
            (tagBytes[p + 5] << 16) |
            (tagBytes[p + 6] << 8) |
            tagBytes[p + 7];
        }

        if (frameSize <= 0 || p + 10 + frameSize > tagBytes.length) break;

        const payload = tagBytes.subarray(p + 10, p + 10 + frameSize);

        if (id === 'TIT2') meta.title = parseTextFrame(payload);
        else if (id === 'TPE1') meta.artist = parseTextFrame(payload);
        else if (id === 'TALB') meta.album = parseTextFrame(payload);
        else if (id === 'TDRC' || id === 'TYER') meta.year = parseTextFrame(payload);
        else if (id === 'TCON') meta.genre = parseTextFrame(payload);
        else if (id === 'APIC' && !meta.coverUrl) {
          const cover = parseAPIC(payload);
          if (cover?.bytes?.length) {
            const blob = new Blob([cover.bytes], { type: cover.mime });
            meta.coverUrl = URL.createObjectURL(blob);
          }
        }

        p += 10 + frameSize;
      }

      return meta;
    }

    resizeAmbientCanvas();
  </script>
